; Qt5 platform theme. Kvantum draws the widgets (and supplies the palette),
; so custom_palette stays off. Activated by QT_QPA_PLATFORMTHEME=qt5ct,
; which scripts/apps.sh writes to /etc/environment.
[Appearance]
style=kvantum
icon_theme=candy-icons
standard_dialogs=default
custom_palette=false

[Fonts]
fixed="FiraCode Nerd Font,10,-1,5,50,0,0,0,0,0"
general="Noto Sans,10,-1,5,50,0,0,0,0,0"

[Interface]
dialog_buttons_have_icons=1
menus_have_icons=true
