# Overrides /usr/lib/modules-load.d/virtualbox-host-dkms.conf, which loads
# vboxdrv, vboxnetadp and vboxnetflt at every boot whether or not you ever open
# VirtualBox. Deployed to /etc/modules-load.d/ by 'make services'; systemd
# prefers /etc over /usr/lib for the same filename, and an empty file loads
# nothing.
#
# Why: out-of-tree DKMS modules built against a fast-moving Arch kernel, sitting
# in the network path (vboxnetflt is a packet filter) and holding AMD-V next to
# kvm_amd, are a poor thing to run permanently on a laptop that never runs a VM.
# They were also a suspect while chasing the 2026-08-23 hangs -- not a confirmed
# cause, but there is no reason to load them by default.
#
# To use VirtualBox: sudo modprobe vboxdrv vboxnetadp vboxnetflt
