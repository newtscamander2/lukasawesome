# picom for the Windows 7 (Aero) desktop.
#
# The one thing Aero cannot fake without a compositor is glass, so unlike the
# dr460nized config this one deliberately blurs the DOCK: the taskbar's
# translucent gradient over a blurred backdrop *is* the Aero effect. Excluding
# the dock (which the dr460nized config does, to keep its floating bar crisp)
# would leave a flat blue strip.

backend = "glx";
vsync = true;

# Win7 rounds window corners by ~6px; Win11 uses 8. The 2px matters more than
# it sounds — 8 already reads as "modern".
corner-radius = 6;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Aero glass: a wide, soft blur. dual_kawase at strength 6 is close to the
# real thing without the cost of a large gaussian kernel.
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = true;
blur-background-exclude = [
  "window_type = 'desktop'",
  # GTK client-side shadows are transparent padding; blurring them smears a
  # halo around every GTK window.
  "_GTK_FRAME_EXTENTS@:c"
];

# Aero's animations were slower and softer than today's.
fading = true;
fade-delta = 6;
fade-in-step = 0.06;
fade-out-step = 0.06;

inactive-opacity = 1;
active-opacity = 1;
frame-opacity = 1;

opacity-rule = [
  "92:class_g = 'Alacritty'"
];

# Aero drop shadows are large, soft and neutral — no coloured glow (that is the
# dr460nized signature). Offsets are symmetric because Aero's light source is
# directly above.
shadow = true;
shadow-radius = 18;
shadow-offset-x = -18;
shadow-offset-y = -14;
shadow-opacity = 0.45;
shadow-color = "#000000";
shadow-ignore-shaped = false;

shadow-exclude = [
  "class_g = 'Conky'",
  "class_g = 'slop'",
  "name = 'Notification'",
  "_GTK_FRAME_EXTENTS@:c"
];

# The taskbar and the start orb DO get a shadow: Win7's bar casts one upward
# onto the desktop, and the orb needs one to look like it sits on the bar.
wintypes:
{
  dock = { shadow = true; full-shadow = false; blur-background = true; };
  utility = { shadow = true; full-shadow = false; };
  desktop = { shadow = false; blur-background = false; };
  tooltip = { fade = true; shadow = true; focus = true; };
};
