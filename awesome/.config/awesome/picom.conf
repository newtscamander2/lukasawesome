# Backend
backend = "glx";
vsync = true;

# Rounded corners (rice look)
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'"
];


# Fading
fading = true;
fade-delta = 4;
fade-in-step = 0.8;
fade-out-step = 0.4;

# General opacity
inactive-opacity = 1;
active-opacity = 1;
# Terminal transparency is set in alacritty.toml (window.opacity) only —
# an opacity-rule here would dim the text along with the background.

# Background blur — the frosted-glass look behind every translucent surface
# (desktop tiles, alacritty). dual_kawase on glx is cheap: it blurs by
# downsample/upsample pyramid, so cost is ~independent of radius. gaussian/box
# would need a ~2*r+1-tap convolution for the same radius; `blur-size` and
# `blur-deviation` are gaussian/box-only knobs and are IGNORED by dual_kawase,
# so they are deliberately not set here.
blur-method = "dual_kawase";
# blur-strength maps to a fixed (iterations, offset, radius) table in picom:
#   5 -> 2 iterations, radius ~24px      8 -> 3 iterations, radius ~51px
# This was 8. A ~51px radius over a 560x470 tile averages away not just the
# wallpaper's detail but its large-scale colour variation too, so the tile
# collapsed to one uniform dark wash — indistinguishable from a flat rectangle,
# i.e. "you can't tell blur is on". 5 still destroys all legible detail (nothing
# survives a 24px radius) while keeping the broad luminance/colour modulation
# that is the actual visual cue for frosted glass: the tile visibly picks up the
# wallpaper underneath it. Raise toward 6-7 for a softer, milkier frost.
blur-strength = 5;
blur-background = true;
blur-background-exclude = [
  # The wibar window is full-width and unshaped: awful.wibar is created 1920x50
  # with bg = "#00000000" and the rounded strip drawn by an INNER widget
  # container, so the window's transparent left/right/top/bottom margins are
  # part of its shape. Blurring it would paint a square-cornered frosted band
  # across those margins around the rounded strip. (To frost the wibar properly,
  # the wibox itself must be shaped — see rc.lua, not here.)
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@"
];

# Neon glow (Dr460nized) — "shadows" are recoloured to the accent and centred
# (offset = -radius) so every window, tile and popup gets a hot-pink halo.
# The wibar (dock) is excluded because its outer region is transparent and the
# glow would paint a full-width rectangle around the window extents.
shadow = true;
shadow-radius = 20;
shadow-offset-x = -20;
shadow-offset-y = -20;
shadow-opacity = 0.50;
shadow-color = "#ff79c6";
shadow-ignore-shaped = false;

shadow-exclude = [
  "class_g = 'Conky'",
  "class_g = 'Polybar'",
  "class_g = 'slop'",
  "name = 'Notification'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@"
];

# picom hard-disables shadows for _NET_WM_WINDOW_TYPE_DESKTOP windows by
# default (set_default_winopts() forces wintype_option[DESKTOP].shadow = false),
# so the desktop tiles were silently getting NO accent halo despite the intent
# stated above. Re-enable it for that type only.
# full-shadow stays off on purpose: the tiles are mostly transparent, and
# drawing the glow *under* the tile body would lay a flat pink wash behind the
# frost — which is the same "flat rectangle" problem we are fixing. Off = the
# halo is clipped to outside the tile, so it reads as a rim glow and leaves the
# frosted backdrop clean.
wintypes:
{
  desktop = { shadow = true; full-shadow = false; };
};
