# Backend
backend = "glx";
vsync = true;

# Rounded corners (rice look)
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'"
];


# Fading
fading = true;
fade-delta = 4;
fade-in-step = 0.8;
fade-out-step = 0.4;

# General opacity
inactive-opacity = 1;
active-opacity = 1;
# Terminal transparency is set in alacritty.toml (window.opacity) only —
# an opacity-rule here would dim the text along with the background.

# Background blur — the frosted-glass look behind every translucent surface
# (desktop tiles, wibar strip, alacritty). dual_kawase on glx is cheap.
blur-method = "dual_kawase";
blur-strength = 8;
blur-background = true;
blur-background-exclude = [
  # The wibar window is full-width and unshaped: blurring it would paint a
  # frosted band across the transparent margins around the rounded strip.
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Neon glow (Dr460nized) — "shadows" are recoloured to the accent and centred
# (offset = -radius) so every window, tile and popup gets a hot-pink halo.
# The wibar (dock) is excluded because its outer region is transparent and the
# glow would paint a full-width rectangle around the window extents.
shadow = true;
shadow-radius = 20;
shadow-offset-x = -20;
shadow-offset-y = -20;
shadow-opacity = 0.50;
shadow-color = "#ff79c6";
shadow-ignore-shaped = false;

shadow-exclude = [
  "class_g = 'Conky'",
  "class_g = 'Polybar'",
  "class_g = 'slop'",
  "name = 'Notification'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c"
];

