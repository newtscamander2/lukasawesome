# ~/.config/alacritty/alacritty.toml
# FiraCode Nerd Font. Colours come from theme.toml, which the awesome
# theme-cycle key (Super+Shift+T) copies from themes/<name>.toml —
# alacritty live-reloads, so open terminals recolour instantly.

[general]
import = ["~/.config/alacritty/theme.toml"]

[window]
padding = { x = 10, y = 10 }
opacity = 0.78
dynamic_padding = true
decorations = "none"

[scrolling]
history = 10000

# Hide transient "[WARN] Unable to store text in clipboard" message bars
# (XCB selection-ownership races). Trade-off: other WARNs are hidden from the
# in-terminal bar too; they still land in the log file.
[debug]
log_level = "Error"

[font]
size = 11.0
normal = { family = "FiraCode Nerd Font", style = "Regular" }
bold   = { family = "FiraCode Nerd Font", style = "Bold" }
italic = { family = "FiraCode Nerd Font", style = "Italic" }

# Make Shift+Enter send ESC+CR (used by some TUIs / shells).
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[cursor]
style = { shape = "Block", blinking = "On" }
