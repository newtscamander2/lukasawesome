# Realtek RTW89 (rtw89_8852bte) — disable the power-saving paths.
#
# Deployed to /etc/modprobe.d/ by 'make services'.
#
# This laptop's wifi firmware crashed and had to be reset by the driver on
# 2026-08-23:
#
#   rtw89_8852bte 0000:01:00.0: SER catches error: 0x1001
#   rtw89_8852bte 0000:01:00.0: FW status = 0xff001100
#   rtw89_8852bte 0000:01:00.0: FW BADADDR = 0xd6666
#
# That one recovered (SER is the driver's System Error Recovery path), but the
# same class of fault is a known cause of hard freezes on rtw89 hardware, and
# this machine was hard-hanging with nothing in the log. The two suspects are
# firmware power-save and PCIe ASPM link states, so both are switched off.
#
# ps_mode=0 keeps the firmware out of its low-power states. The ASPM options
# stop the PCIe link from entering L1/L1SS, which is where rtw89 tends to lose
# the device. Costs a little idle battery; buys a wifi chip that stays answering.
#
# If the hangs are eventually traced to something else, this can go.
options rtw89_core ps_mode=0
options rtw89_pci disable_aspm_l1=y disable_aspm_l1ss=y disable_clkreq=y
