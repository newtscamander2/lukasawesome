# Catppuccin Mocha greeter — deployed to /etc/lightdm/ by scripts/services.sh.
# Flat base-color background: asset-free, matches the desktop the moment you
# log in (and doubles as the lock screen via light-locker).
[greeter]
background=#1e1e2e
theme-name=Adwaita-dark
icon-theme-name=Adwaita
font-name=FiraCode Nerd Font 11
xft-antialias=true
xft-hintstyle=hintfull
indicators=~host;~spacer;~clock;~spacer;~session;~power
clock-format=%H:%M
position=50%,center 50%,center
