# Deployed to /etc/lightdm/lightdm.conf.d/ by scripts/services.sh.
#
# Runs for EVERY X server LightDM starts — the user session and the greeter's
# own server (light-locker VT-switches to the latter for the lock screen).
# Without this, the greeter's X server blanks + DPMS-offs the monitor after
# its default 10 minutes, and amdgpu on the RX 7600 (Navi 33) sometimes never
# relights the display afterwards ("REG_WAIT timeout ... optc32_disable_crtc"
# in dmesg) — black screen that ignores all input, reboot required.
# rc.lua re-enables the plain screensaver timeout (xset s 300 0) in the user
# session, which is all light-locker needs to keep locking after 5 min idle.
[Seat:*]
display-setup-script=/usr/bin/xset s off -dpms
