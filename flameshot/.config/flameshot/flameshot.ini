[General]
; Bypass xdg-desktop-portal and grab the screen through Qt/X11 directly.
;
; Flameshot 14 routes every capture through the portal's Screenshot interface,
; even on X11. On this desktop there is no backend that implements it: only
; xdg-desktop-portal-gtk is installed, whose .portal file lists no
; org.freedesktop.impl.portal.Screenshot, so the interface is not exported at
; all -- `busctl` answers "No such interface org.freedesktop.portal.Screenshot".
; Flameshot then waits out its own 30-second timeout and produces nothing:
; Super+m appears to do absolutely nothing, and `flameshot full -p file.png`
; writes no file and exits non-zero.
;
; With this set, capture goes through Qt's X11 path and returns instantly.
; Upstream marks the legacy method deprecated and may remove it, but there is
; no portal backend for bare AwesomeWM to migrate to, so it is the right
; setting here. Only consulted on X11; ignored under Wayland.
useX11LegacyScreenshot=true
