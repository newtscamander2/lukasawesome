# Compressed swap in RAM, deployed to /etc/systemd/zram-generator.conf by
# 'make services'. The zram-generator package alone does nothing: without this
# file no zram device is created, which is how this machine ended up with the
# package installed and no compressed swap at all.
#
# Useful here because the disk is LUKS-encrypted btrfs: swapping to it means
# encrypting every page on the way out. Compressing in RAM instead avoids the
# disk entirely for the common case.
[zram0]
# zstd over the lz4 default: noticeably better ratio, and compression is not
# the bottleneck when the alternative is touching an encrypted disk.
compression-algorithm = zstd
# No zram-size set on purpose -- the generator's default (half of RAM, capped)
# is the right answer on every machine this repo installs, and hardcoding a
# size here would be wrong on the next one.
